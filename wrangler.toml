name = "gr0ut-dispo-bot"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Stockage des dispos (créé via : wrangler kv namespace create DISPO).
# Colle l'id renvoyé ci-dessous.
[[kv_namespaces]]
binding = "DISPO"
id = "f6885653ef7c4566b6d5576b617a3793"

# Vendredi 08:00 ET 09:00 UTC (1 seul cron) = 10h Paris été/hiver. Le code ne poste qu'à 10h
# Paris, une seule fois (verrou KV).
# Attention : chez Cloudflare le jour 1 = dimanche (donc "5" = jeudi !). On écrit FRI.
[triggers]
crons = ["0 8,9 * * FRI"]

# Variables NON secrètes. Secrets à poser : DISCORD_PUBLIC_KEY, DISCORD_TOKEN, TEST_KEY
[vars]
DISCORD_APP_ID = "1543983109622595595"
DISPO_CHANNEL_ID = "1473014802702926013"
# Panneau des line-ups (Manœuvres) : ids des rôles LU séparés par des virgules, dans
# l'ordre des boutons, sections séparées par "|" (titres dans LU_GROUPS, même ordre),
# et id du rôle Remplaçant. Les boutons prennent le nom des rôles sur Discord.
# Rempli par src/setup-lu.js.
LU_ROLE_IDS = "1564576401724670002,1564576402689359872,1564576403800723557,1564576406254518313,1564576407483453452,1564576408926158950,1564576410130059344|1564576411367252009,1564576412990574662,1564576413913190454,1564576415490252992,1564576416862052424,1564576418321535066,1567257772393898136,1568026648853356635"
LU_GROUPS = "Montée de palier|Full reset"
LU_SUB_ROLE_ID = "1564576400189423669"
# Salons Remplaçant (texte,vocal) cités dans l'annonce du panneau (rempli par setup-lu.js)
LU_SUB_CHANNEL_IDS = "1564576422910230580,1564576425061654568"
# À qui écrire pour créer ou renommer une LU : id Discord (mention cliquable) ou pseudo
LU_CONTACT = "330050654125162511"
# Annonces des lives Twitch (src/stream.js). Secrets à poser en plus : TWITCH_CLIENT_ID,
# TWITCH_CLIENT_SECRET (appli de dev.twitch.tv) et TWITCH_EVENTSUB_SECRET.
# Salon des annonces (📽️Stream)
STREAM_CHANNEL_ID = "1444692493760205004"
# Ping de l'annonce : "everyone", un id de rôle, ou "" pour ne pinger personne
STREAM_PING = "everyone"
# Rôles qui peuvent inscrire eux-mêmes leur chaîne (les rôles du clan) ; vide = tout le
# monde. Les officiers (Gérer les rôles / le serveur) peuvent toujours inscrire n'importe qui.
# Rôle donné automatiquement au propriétaire d'une chaîne inscrite (TWITCH) ; vide = aucun
STREAMER_ROLE_ID = "1444699600471589087"
STREAM_ROLE_IDS = "1397250111536496710,1442955236502143037,1358489399934845228,1290233405752999936,1480973835426599072,1290579033737793606,1405979431297880134,804699000628445185,1290235458294648914,1411354662325588018,1480184727611768934,804625653244624927,1290045874046763160,1411355366494703708"
